name: Add MIT License to All Repositories

# The script is TypeScript and runs on Bun, so the job runs inside the same
# image used for local development: cartagodocker/nodebun. It already carries
# Bun, Node, npm, fnm and git, so nothing else has to be installed.
#
# The image tags are exact and there is no `latest`: see
# https://hub.docker.com/r/cartagodocker/nodebun. Bump the tag when a new
# matrix is published.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write, commit and push the LICENSE files (off = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  add-license:
    runs-on: ubuntu-latest
    container:
      image: cartagodocker/nodebun:v2.0.2_n26.3.1_b1.4.2
    env:
      OWN_GITHUB_TOKEN: ${{ secrets.OWN_GITHUB_TOKEN }}
      WORKSPACE: /tmp/license-workspace
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Report runtime versions
        run: |
          echo "node: $(node --version)"
          echo "bun:  $(bun --version)"
          echo "git:  $(git --version)"

      - name: Configure Git identity
        run: |
          git config --global user.name "Cartago - Automatic Workflow"
          git config --global user.email "cv2mario@gmail.com"

      - name: Configure Git credentials
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$OWN_GITHUB_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Run the MIT license script
        run: |
          mkdir -p "$WORKSPACE"
          if [ "${{ inputs.apply }}" = "true" ]; then
            bun scripts/repositories/add-mit-license-all-repositories.ts --workspace="$WORKSPACE" --apply
          else
            bun scripts/repositories/add-mit-license-all-repositories.ts --workspace="$WORKSPACE"
          fi
