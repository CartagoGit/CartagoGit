    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #475A7C;
    }
    .stagger {
      opacity: 1;
      
    }
    #rect-mask rect{
      
    }
    .lang-progress{
      
    }
    

          
      /* Animations */
      
        to {
