<svg xmlns="http://www.w3.org/2000/svg" width="250" height="126" viewBox="0 0 250 126" role="img" aria-label="DelendAI: 17,519 commits, 638K source, 462K tests, tests over source 72%"><defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13253f"/><stop offset="1" stop-color="#0c1727"/></linearGradient></defs><rect x=".5" y=".5" width="249" height="125" rx="12" fill="url(#tile)" stroke="#2b4786"/><svg x="14" y="15" width="38" height="38" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="mc" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#58a6ff"/>
			<stop offset="1" stop-color="#a371f7"/>
