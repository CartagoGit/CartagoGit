<svg xmlns="http://www.w3.org/2000/svg" width="250" height="176" viewBox="0 0 250 176" role="img" aria-label="DelendAI: Extensible MCP server core"><defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef7"/></linearGradient></defs><rect x=".5" y=".5" width="249" height="175" rx="12" fill="url(#tile)" stroke="#bfcee6"/><svg x="20" y="18" width="52" height="52" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="mc" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#58a6ff"/>
			<stop offset="1" stop-color="#a371f7"/>
		</linearGradient>
	</defs>
	<!-- outer hexagon frame (the agnostic boundary) -->
	<path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" fill="none" stroke="url(#mc)" stroke-width="4.5" stroke-linejoin="round"/>
	<!-- spokes: core → plugin nodes -->
	<g stroke="url(#mc)" stroke-width="3.5" stroke-linecap="round">
		<line x1="32" y1="32" x2="32" y2="8"/>
		<line x1="32" y1="32" x2="11.5" y2="44"/>
		<line x1="32" y1="32" x2="52.5" y2="44"/>
	</g>
	<!-- the core (center), covering the spoke origins -->
	<path d="M32 21 L41 26.5 L41 37.5 L32 43 L23 37.5 L23 26.5 Z" fill="url(#mc)"/>
	<!-- plugin nodes at three vertices -->
	<g fill="url(#mc)">
		<circle cx="32" cy="8" r="5"/>
		<circle cx="11.5" cy="44" r="5"/>
		<circle cx="52.5" cy="44" r="5"/>
	</g>
</svg><text x="86" y="39" fill="#12233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">DelendAI</text><text x="86" y="59" fill="#1c5ed4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Extensible MCP server core</text><line x1="20" y1="86" x2="230" y2="86" stroke="#bfcee6"/><text x="20" y="111" fill="#475a7c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">62 isolated plugins · CLI · 18 CI gates</text><rect x="20" y="133" width="92" height="25" rx="7" fill="#1c5ed4" fill-opacity=".14"/><text x="66" y="150" text-anchor="middle" fill="#1c5ed4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">OPEN REPOSITORY</text><text x="230" y="150" text-anchor="end" fill="#475a7c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">↗</text></svg>