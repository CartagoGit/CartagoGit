<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DelendAI">
        <!-- DelendAI: the hexagon core with its plugin nodes, in the product's
             own blue-to-violet gradient, on the same tile every other icon
             uses so they line up as one set. -->
        <defs>
                <linearGradient id="mc" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#58a6ff"/>
                        <stop offset="1" stop-color="#a371f7"/>
                </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="#0d1117"/>
        <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#mc)" stroke-width="2" opacity=".6"/>
        <!-- outer hexagon frame (the agnostic boundary) -->
        <path d="M32 12 L52 24 L52 44 L32 56 L12 44 L12 24 Z" fill="none" stroke="url(#mc)" stroke-width="4" stroke-linejoin="round"/>
        <!-- spokes: core to plugin nodes -->
        <g stroke="url(#mc)" stroke-width="3" stroke-linecap="round">
                <line x1="32" y1="32" x2="32" y2="14"/>
                <line x1="32" y1="32" x2="15" y2="43"/>
                <line x1="32" y1="32" x2="49" y2="43"/>
        </g>
        <!-- the core (center), covering the spoke origins -->
        <path d="M32 23 L39.5 27.5 L39.5 36.5 L32 41 L24.5 36.5 L24.5 27.5 Z" fill="url(#mc)"/>
        <!-- plugin nodes at three vertices -->
        <g fill="url(#mc)">
                <circle cx="32" cy="14" r="4.4"/>
                <circle cx="15" cy="43" r="4.4"/>
                <circle cx="49" cy="43" r="4.4"/>
        </g>
</svg>
