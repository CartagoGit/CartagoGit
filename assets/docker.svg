<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Docker images">
        <!-- The Docker whale, carrying containers — the same mark Docker Hub
             shows, on the shared tile. -->
        <defs>
                <linearGradient id="docker-blue" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#4aa8ff"/>
                        <stop offset="1" stop-color="#1f6fd0"/>
                </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="#0d1117"/>
        <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2496ed" stroke-width="2" opacity=".6"/>
        <g fill="url(#docker-blue)">
                <!-- the containers on the whale's back -->
                <rect x="15" y="26" width="7" height="6" rx="1"/>
                <rect x="23" y="26" width="7" height="6" rx="1"/>
                <rect x="31" y="26" width="7" height="6" rx="1"/>
                <rect x="19" y="19" width="7" height="6" rx="1"/>
                <rect x="27" y="19" width="7" height="6" rx="1"/>
                <rect x="35" y="19" width="7" height="6" rx="1"/>
                <!-- the whale -->
                <path d="M8 38 h30 c0 0 5 0 7 -3 l4 -6 c1 -2 3 -1 3 1 c0 2 -1 4 -2 5 c3 0 5 -1 6 -2 c1 4 -3 8 -8 9 c-2 6 -9 9 -17 9 c-12 0 -21 -5 -23 -13 Z"/>
        </g>
</svg>
